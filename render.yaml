databases:
  - name: hackathon-base-db
    plan: free
    databaseName: hackathon_base
    user: hackathon_base

services:
  - type: web
    name: hackathon-base
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate && python manage.py bootstrap_admin"
    startCommand: "gunicorn config.wsgi"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      # Both domains listed on purpose: the service currently answers on
      # hackathon-base.onrender.com, and will also answer on
      # gotov-k-tolchku.onrender.com once it's manually renamed in the
      # Render dashboard to take over that name from the retired static
      # site — no second deploy needed just for that rename.
      - key: ALLOWED_HOSTS
        value: hackathon-base.onrender.com,gotov-k-tolchku.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: hackathon-base-db
          property: connectionString
      - key: ADMIN_USERNAME
        value: kamilla_admin
      - key: ADMIN_EMAIL
        value: shertaevakamilla@gmail.com
      - key: ADMIN_PASSWORD
        sync: false
