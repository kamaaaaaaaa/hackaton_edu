databases:
  - name: hackathon-base-db
    plan: free
    databaseName: hackathon_base
    user: hackathon_base

services:
  - type: web
    name: hackathon-base
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput"
    startCommand: "gunicorn config.wsgi"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: ALLOWED_HOSTS
        value: your-app-name.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: hackathon-base-db
          property: connectionString
