databases:
  - name: hackathon-base-db
    plan: free
    databaseName: hackathon_base
    user: hackathon_base

services:
  - type: web
    name: hackathon-base
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn config.wsgi"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: ALLOWED_HOSTS
        value: hackathon-base.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: hackathon-base-db
          property: connectionString

  - type: web
    name: gotov-k-tolchku
    env: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
