<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Что-то пошло не так</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
    <style>
      :root{
        --bg:#EEF2F0;
        --text:#23302B;
        --card:#FFFFFF;
        --card-border:#D8E0DC;
        --teal:#3E6E64;
        --teal-soft:#E3EBE8;
        --accent:#B5763B;
        --muted:#6E7B75;
      }
      html, body{
        background:var(--bg);
        color:var(--text);
        font-family:'IBM Plex Sans', sans-serif;
        font-weight:400;
      }
      h1, h2, h3{
        font-family:'Source Serif 4', serif;
        font-weight:600;
      }
      .topbar{
        background:var(--card);
        border-bottom:1px solid var(--card-border);
        box-shadow:none;
      }
      .wordmark{
        font-family:'Source Serif 4', serif;
        font-weight:600;
        color:var(--teal);
      }
      .text-secondary{ color:var(--muted) !important; }
      .text-muted{ color:var(--muted) !important; }
      .btn-primary{
        background-color:var(--accent);
        border-color:var(--accent);
        border-radius:8px;
        box-shadow:none;
      }
      .btn-primary:hover{
        background-color:var(--accent);
        border-color:var(--accent);
        opacity:0.9;
      }
    </style>
</head>
<body>
    <div class="topbar">
        <div class="container">
            <span class="wordmark py-3 d-inline-block">Hackathon Base</span>
        </div>
    </div>

    <main class="container py-4">
        <div class="d-flex flex-column align-items-center justify-content-center text-center" style="min-height: 70vh;">
            <div class="display-1 text-secondary fw-bold" style="font-size: 6rem;">500</div>
            <h1 class="fw-bold mt-3">Что-то пошло не так</h1>
            <p class="text-muted mb-4">На сервере произошла ошибка. Мы уже разбираемся — попробуйте обновить страницу через пару минут.</p>
            <a href="/" class="btn btn-primary btn-lg">На главную</a>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
