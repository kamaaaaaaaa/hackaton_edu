{% extends "base.html" %}

{% block title %}Регистрация | Hackathon Starter{% endblock %}

{% block content %}
    <div class="row justify-content-center">
        <div class="col-md-5">
            <h1 class="h3 mb-3">Регистрация</h1>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary">Зарегистрироваться</button>
            </form>
            <p class="mt-3">
                Уже есть аккаунт? <a href="{% url 'login' %}">Войти</a>
            </p>
        </div>
    </div>
{% endblock %}
