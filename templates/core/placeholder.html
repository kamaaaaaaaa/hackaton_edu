{% extends "base.html" %}

{% block title %}{{ heading }} | AntiВыгорание{% endblock %}

{% block content %}
<div class="quiet-column">
    <section class="card panel">
        <h2>{{ heading }}</h2>
        <p class="panel-sub">{{ description }}</p>
        {% if bullets %}
            <ul class="placeholder-bullets">
                {% for bullet in bullets %}
                    <li>{{ bullet }}</li>
                {% endfor %}
            </ul>
        {% endif %}
        <p class="placeholder-tag">Скоро здесь появится...</p>
    </section>
</div>
{% endblock %}
